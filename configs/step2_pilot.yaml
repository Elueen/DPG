# =====================================================================
# Step 2 pilot 配置(data-aware specification 阶段)
# 纪律:pilot 数据不进 git;本文件登记的 recording/片段 ID
#       将来强制划入 train/dev split,永不进 test
# =====================================================================

meta:
  seed: 42

resample_hz: 10.0

# ---------------------------------------------------------------------
# 数据路径与 pilot 片段选择(填你本地/服务器的实际路径)
# highd.recordings:跑 list_highd_candidates.py 看密度统计后填 2 个,
#   一个偏自由流(free_flow)、一个偏高密度(dense),不同 locationId
# ---------------------------------------------------------------------
#paths:
#  highd_root: /net/scratch/j90633xl/DPG/data/raw/highD
#  ngsim_i80: /net/scratch/j90633xl/DPG/data/raw/ngsim/i-80/trajectories-0400-0415.csv
#  ngsim_us101: /net/scratch/j90633xl/DPG/data/raw/ngsim/us-101/trajectories-0750-0805.csv
paths:
  highd_root: /net/scratch/j90633xl/DPG/data/raw/highD
  ngsim_i80: /net/scratch/j90633xl/DPG/data/I-80-Emeryville-CA/vehicle-trajectory-data/0400pm-0415pm/trajectories-0400-0415.txt
  ngsim_us101: /net/scratch/j90633xl/DPG/data/US-101-LosAngeles-CA/vehicle-trajectory-data/0750am-0805am/trajectories-0750am-0805am.txt

highd:
  fix_width_length_swap: true
  normalize_direction: true
  recordings:
    free_flow: 3
    dense: 13

ngsim:
  segment_offset_s: 0.0        # 片段起点相对文件 Global_Time 最小值的偏移
  segment_duration_s: 900.0    # 15 分钟
  savgol_window: 21            # 2.1 s @10Hz(平滑与求导共用)
  savgol_polyorder: 3

# ---------------------------------------------------------------------
# A3 canonical 层(语义冻结 + Gate A 检查阈值)
#   highd_bbox_topleft: highD 原始 x,y 为包围盒左上角 -> +L/2,+W/2 转几何中心
#   ngsim_local_y_is_front: NGSIM Local_Y 为车前端 -> -L/2 转几何中心
#   两个位置假设由 run_canonical_checks 用 dhw / Space_Headway 实证校验
# ---------------------------------------------------------------------
canonical:
  highd_bbox_topleft: true
  ngsim_local_y_is_front: true
  lane_center_min_obs: 50
  checks:
    max_speed_mps: 60.0
    max_abs_ax: 10.0
    max_abs_ay: 5.0
    gap_median_abs_err_m: 1.0     # 计算 gap vs 数据集自带口径的中位绝对误差上限
    gap_bias_abs_m: 1.0           # 系统性偏差上限(半车长量级偏差=中心假设错)
    n_validation_sample: 20000

# ---------------------------------------------------------------------
# 任务 B(B1/B2)interaction 抽取
#   onset 三候选:fixed_lead / lat_vel / compound(定义见 src/data/interactions.py)
#   h_pre_s / h_response_s:前史与响应窗(自 t0 起)
#   validity:gap0 范围、双方覆盖、opponent 响应窗内不换道
# ---------------------------------------------------------------------
interaction:
  merge_window_s: 5.0
  h_pre_s: 3.0
  h_response_s: 4.0
  gap0_max_m: 80.0
  onset:
    fixed_lead_s: 2.0
    lat_vel_th_mps: 0.2
    sustain_s: 0.5
    max_lead_s: 4.0
    disp_th_m: 0.3

# ---------------------------------------------------------------------
# 任务 B(B3/B4)观测动作三候选定义
#   D1 decel:速度削减阈值;D2 gap:相对匀速外推的 accommodation 距离;
#   D3 compound:任一强信号或联合弱信号(d3_joint_frac 为联合折扣)
#   sens_factors:敏感性缩放(±30%)
# ---------------------------------------------------------------------
actions:
  d1_yield_mps: 1.0
  d1_hold_mps: 0.4
  d2_yield_m: 2.0
  d2_hold_m: 0.5
  d3_joint_frac: 0.5
  sens_factors: [0.7, 1.3]
  max_abs_ax_physical: 8.0     # 响应窗内 opp |ax| 上限;超出=跟踪毛刺,validity 剔除

# ---------------------------------------------------------------------
# 任务 C counterfactual 模板与 rollout(定义见 src/counterfactual.py)
#   yield = 升余弦减速脉冲(a_peak, horizon);hold = 匀速外推
#   sens_*:预注册敏感性网格(不做参数搜索)
# ---------------------------------------------------------------------
counterfactual:
  a_peak_mps2: 1.0
  horizon_s: 4.0
  v_floor_mps: 0.0
  sens_a_factors: [0.7, 1.0, 1.3]
  sens_horizons: [3.0, 4.0, 5.0]

# ---------------------------------------------------------------------
# 任务 D/E evidence + 解析 utility + perception noise
#   (定义见 src/evidence.py / src/utility.py / docs specs)
#   closing rate 符号写死:c = v_O - v_E,c>0 = closing
#   safety(二维):g_tilde = smin_{rho_g}[gap - d0 - h_ref*v_O],
#                 c_tilde = smax_{rho_c}[c];m_s = g_tilde - c_+^2/(2 b_ref)
#   efficiency(一维):z_e = rollout progress;m_e = z_e - v_ref*T
#   u_k = tanh(margin_k / scale_k);F-A: T_k = identity
#   v_ref_mps:外生 site-level reference speed(逐 site P85;非 free-flow),
#   compute_vref.py 一次计算冻结
# ---------------------------------------------------------------------
evidence:
  d0_m: 2.0            # standstill clearance(静止最小间距)
  h_ref_s: 0.9         # reference time headway(参考时距)
  b_ref_mps2: 2.5      # reference braking decel(closing-distance 项)
  softplus_beta: 2.0
  rho_g_m: 2.0         # softmin 温度(米)
  rho_c_mps: 0.5       # softmax 温度(m/s)
utility:
  s_margin_m: 10.0
  s_progress_m: 20.0
  grad_check_tol: 1.0e-6
  v_ref_mps:
    loc2: 37.13
    loc1: 33.66
    i80: 10.78
    us101: 16.04
perception_noise:
  a_g_m: 10.0          # zeta_g = g_tilde / a_g
  a_c_mps: 5.0         # zeta_c = c_tilde / a_c
  a_e_m: 20.0          # zeta_e = (z_e - v_ref*T) / a_e
  sigma_s_ref: 1.0     # Sigma_s = sigma_s_ref * I_2(reference specification)
  sigma_e_ref: 1.0
  sens_sigma: [0.5, 1.0, 2.0]
