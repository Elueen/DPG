# =====================================================================
# Step 1 REVISION 配置(第一轮 configs/step1_toy_game.yaml 原样封存不动)
# 统一符号:theta_O = (w_s, kappa_s, kappa_e),sigma_eff,q_O(c; theta)
# 模型谱系:
#   M0a: legacy 第一轮,total-utility-scale additive noise
#        sigma_eff^2 = 2*(1/ks + 1/ke)
#   M0 : component-evaluation additive noise
#        sigma_eff^2 = 2*(ws^2/ks + we^2/ke)
#   M1 : perception-derived context-sensitive component uncertainty
#        V1(c) = ws^2*Gs(c)/ks + we^2*Ge(c)/ke,G 由 f/z/Sigma 的
#        derivative 计算,禁止在本文件中直写 G
# =====================================================================

meta:
  seed: 42

models: [m0a, m0, m1]

# ---------------------------------------------------------------------
# perception:identification toy functions(非最终真实驾驶 utility)
#   safety: 中心化 logistic(关于 shift 奇对称,梯度偶对称——
#           insufficient 家族的符号翻转技巧依赖该性质)
#   efficiency: softplus(梯度单调)
#   sigma: evidence 感知噪声的方差尺度 Sigma_k(eta_k ~ N(0, Sigma_k/kappa_k))
#   grad_step: G_k 数值微分(中心差分)步长
# ---------------------------------------------------------------------
perception:
  f:
    safety:     {type: logistic, amplitude: 2.0, scale: 0.8, shift: 0.0}
    efficiency: {type: softplus, amplitude: 1.0, scale: 1.0, shift: 0.0}
  sigma:
    safety: 1.0
    efficiency: 1.0
  grad_step: 1.0e-5

# ---------------------------------------------------------------------
# context 家族(每家族 3 个 context;a1=yield, a0=hold;
# a_E 已吸收进 context 定义——每个 context 即"给定 ego 候选动作与场景")
# 设计意图(数值均已在开发端验证):
#   strong_diversity:      G_s/G_e 跨 context 变化 4 个数量级(166 / 0.01 / 1.8)
#   moderate_diversity:    G_s/G_e 温和变化(1.53 / 1.38 / 0.93)
#   insufficient_diversity:G_s、G_e 跨 context 相同至数值微分精度(负对照;
#     效率侧 evidence 固定,安全侧只做符号翻转,logistic 梯度偶对称保 G 不变,
#     Δu_s 仍随 context 变化,故 context 间 mu 可分而 precision 载荷不可分)
# ---------------------------------------------------------------------
context_families:
  strong_diversity:
    safety_sensitive:
      safety:     {a1: 0.15, a0: -0.25}
      efficiency: {a1: -2.8, a0: -3.3}
    efficiency_sensitive:
      safety:     {a1: 3.3,  a0: 2.8}
      efficiency: {a1: 0.35, a0: -0.25}
    mixed:
      safety:     {a1: 0.45, a0: -0.05}
      efficiency: {a1: 0.1,  a0: -0.6}
  moderate_diversity:
    ctx_a:
      safety:     {a1: 0.3,  a0: -0.2}
      efficiency: {a1: 0.25, a0: -0.35}
    ctx_b:
      safety:     {a1: 1.0,  a0: 0.4}
      efficiency: {a1: 0.1,  a0: -0.7}
    ctx_c:
      safety:     {a1: 0.1,  a0: -0.8}
      efficiency: {a1: 0.6,  a0: 0.05}
  insufficient_diversity:
    ctx_a:
      safety:     {a1: 0.5,  a0: -0.3}
      efficiency: {a1: 0.35, a0: -0.3}
    ctx_b:
      safety:     {a1: 0.5,  a0: 0.3}
      efficiency: {a1: 0.35, a0: -0.3}
    ctx_c:
      safety:     {a1: -0.5, a0: 0.3}
      efficiency: {a1: 0.35, a0: -0.3}

# ---------------------------------------------------------------------
# R1 数值一致性检查参数
#   lin_mc: 线性化 MC vs 解析(同一模型,只剩抽样误差)
#   full_mc: 全非线性感知 MC vs 解析(量化一阶 Taylor 误差;
#     开发端校准:kappa in [0.5, 200] 内最大偏差 3.9e-3 概率单位)
# ---------------------------------------------------------------------
consistency_checks:
  lin_mc:  {n_samples: 4000000, tol: 1.0e-3}
  full_mc: {n_samples: 4000000, tol_working_range: 6.0e-3, kappa_probe: [0.5, 3.0, 30.0]}

# ---------------------------------------------------------------------
# R2(新 C3)结构可辨识性
#   参数化 (w_s, log ks, log ke);中心差分步长;numerical rank 阈值
#   probe_thetas:局部分析的评估点(含靠近 w 边界与强不对称 kappa)
# ---------------------------------------------------------------------
identifiability:
  fd_step_w: 1.0e-6
  fd_step_logk: 1.0e-6
  rank_rtol: 1.0e-7
  probe_thetas:
    mid:        {w_s: 0.6, kappa_s: 3.0, kappa_e: 3.0}
    asym_kappa: {w_s: 0.6, kappa_s: 1.0, kappa_e: 8.0}
    low_w:      {w_s: 0.3, kappa_s: 3.0, kappa_e: 3.0}

# ---------------------------------------------------------------------
# R3(新 C4)Fisher information
#   n_per_context:名义每 context 观测数(信息矩阵尺度)
#   probe_theta:评估点
#   probe_contexts:六类探针(inline evidence 或引用 context_families)
#     - indifference:mu ~ 0(payoff indifference)
#     - moderate_contrast / saturated(near-deterministic)
#     - safety_/efficiency_sensitive、同 G 负对照(引用既有 context)
#   designed_portfolio:理论指导组合(逐参数各一类 context)
#   regime_thresholds:min_eig 的报告口径(identifiable/weak/non)
# ---------------------------------------------------------------------
fisher:
  n_per_context: 100
  probe_theta: {w_s: 0.6, kappa_s: 3.0, kappa_e: 3.0}
  probe_contexts:
    indifference:
      safety:     {a1: 0.2,    a0: -0.2}
      efficiency: {a1: -0.323, a0: 0.35}
    moderate_contrast:
      safety:     {a1: 0.45, a0: -0.05}
      efficiency: {a1: 0.1,  a0: -0.6}
    saturated:
      safety:     {a1: 1.2,  a0: -1.2}
      efficiency: {a1: 1.5,  a0: -1.0}
    safety_sensitive:     {family_ref: strong_diversity, context: safety_sensitive}
    efficiency_sensitive: {family_ref: strong_diversity, context: efficiency_sensitive}
    negctrl_same_g_a:     {family_ref: insufficient_diversity, context: ctx_a}
    negctrl_same_g_b:     {family_ref: insufficient_diversity, context: ctx_b}
  designed_portfolio: [indifference, safety_sensitive, efficiency_sensitive]
  regime_thresholds: {min_eig_identifiable: 0.1, min_eig_weak: 1.0e-4}

# ---------------------------------------------------------------------
# R4(新 C5)等价脊线(M0a/M0/M1 同框)
#   观测等价:各 context |Δq_O| < tol;网格与第一轮同规格
#   reference_points 与 identifiability probe 对齐;primary_reference
#   为主图使用的参考点(其余参考点进 metrics json)
# ---------------------------------------------------------------------
equivalence_rev:
  tol: 0.01
  grid:
    w_s:     {min: 0.0, max: 1.0,  n: 50, spacing: linear}
    kappa_s: {min: 0.1, max: 30.0, n: 50, spacing: log}
    kappa_e: {min: 0.1, max: 30.0, n: 50, spacing: log}
  reference_points:
    mid:        {w_s: 0.6, kappa_s: 3.0, kappa_e: 3.0}
    asym_kappa: {w_s: 0.6, kappa_s: 1.0, kappa_e: 8.0}
    low_w:      {w_s: 0.3, kappa_s: 3.0, kappa_e: 3.0}
  primary_reference: mid

# ---------------------------------------------------------------------
# R5(新 C6)finite-sample recovery
#   数据生成与似然均在被测模型内;theta* 引用 equivalence_rev 参考点
#   置信区域 = 95% likelihood-ratio confidence region(非 Bayesian posterior)
#   预算:single = 全给 single_context_index 指定的 context;
#         multi = 同一总预算均分(allocation: even),总样本守恒
#   coverage 正式 replicates >= 200,默认 500
#   grid_n:recovery 网格密度(500 reps 下 30^3 为速度/精度平衡)
# ---------------------------------------------------------------------
recovery:
  models: [m0, m1]
  true_theta_key: mid
  n_values: [10, 30, 100, 300, 1000]
  n_replicates: 500
  confidence_level: 0.95
  prob_clip: 1.0e-12
  allocation: even
  single_context_index: 0
  grid_n: 30